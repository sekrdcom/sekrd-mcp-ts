name: Publish to npm and MCP Registry

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance and mcp-publisher login github-oidc
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.1

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Skip when this exact version is already on npm, including when
      # NODE_AUTH_TOKEN is empty. Fail only when it is missing and there is
      # no token. A skip exits 0 so the registry steps below still run.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # Actions uses bash -e. A failing npm view inside `if` does not abort.
          if PUBLISHED=$(npm view "@sekrd/mcp-server@${VERSION}" version 2>/dev/null); then
            if [ "$PUBLISHED" = "$VERSION" ]; then
              echo "@sekrd/mcp-server@${VERSION} is already on npm; skipping publish."
              exit 0
            fi
          fi
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NODE_AUTH_TOKEN is empty and @sekrd/mcp-server@${VERSION} is not on npm."
            exit 1
          fi
          npm publish --provenance --access public

      # The registry checks the published npm package for mcpName. These steps
      # run after a successful publish and after a skip of an existing version.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
